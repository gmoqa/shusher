<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="canonical" href="{{url}}">
{{alternates}}
<meta name="theme-color" content="#FFF4E0">
<link rel="icon" href="{{root}}favicon.png">
<link rel="preload" href="{{root}}fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Nunito"; src: url("{{root}}fonts/nunito-latin.woff2") format("woff2"); font-weight: 200 1000; font-display: swap; }
  body { margin: 0; background: #FFF4E0; color: #33303F; font: 18px/1.65 "Nunito", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 24px 64px; }
  header { display: flex; align-items: center; gap: 12px; padding: 4px 0 28px; }
  header a { display: flex; align-items: center; gap: 12px; color: #33303F; text-decoration: none; font-weight: 900; font-size: 1.3rem; }
  header img { width: 44px; height: 44px; border-radius: 12px; }
  h1 { font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.12; font-weight: 900; margin: 0 0 .3em; }
  h2 { font-size: 1.3rem; font-weight: 900; margin: 1.8em 0 .4em; }
  p { margin: 0 0 1em; }
  .muted { color: #6E6A7C; }
  a { color: #1A75AD; }
  .back { display: inline-block; margin-top: 32px; font-weight: 800; }
</style>
</head>
<body>
<main>
  <header><a href="{{home}}"><img src="{{root}}img/logo.webp" width="44" height="44" alt="">Shusher</a></header>
  <h1>{{h1}}</h1>
  <p class="muted">{{updated}}</p>
{{sections}}
  <a class="back" href="{{home}}">{{back}}</a>
</main>
</body>
</html>
